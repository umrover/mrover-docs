name: sync esw docs

# esw docs are authored in umrover/mrover-esw
# the esw repo will fire a repository_dispatch to open/update
# a PR here regenerating the esw section of this docs platform
on:
  repository_dispatch:
    types: [esw-docs-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-esw
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: mint an app token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      # NOTE if mrover-esw is ever made private, auth needed here
      - uses: actions/checkout@v4
        with:
          repository: umrover/mrover-esw
          ref: main
          path: .esw-src

      # runner python sufficient (stdlib only)
      - name: sync esw docs
        run: python3 scripts/sync_esw.py .esw-src

      # noop when nothing changed, force-pushes the branch otherwise
      - name: open a pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.token.outputs.token }}
          branch: esw-docs-sync
          add-paths: |
            astro.config.mjs
            src/content/docs/esw
          commit-message: "docs: sync esw docs from umrover/mrover-esw@${{ github.event.client_payload.sha || 'main' }}"
          title: "docs: sync esw docs"
          body: |
            generated by `scripts/sync_esw.py` from
            [umrover/mrover-esw@${{ github.event.client_payload.sha || 'main' }}](https://github.com/umrover/mrover-esw/commit/${{ github.event.client_payload.sha || 'main' }})

            edit the esw docs in that repo, merging deploys to docs.mrover.org
